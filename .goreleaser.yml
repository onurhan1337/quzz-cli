version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: quzz
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: onurhan1337
    name: quzz-cli
  draft: false
  prerelease: auto

brews:
  - name: quzz-cli
    repository:
      owner: onurhan1337
      name: homebrew-tap
    description: "CLI tool for visualizing and analyzing quzz traces"
    homepage: "https://github.com/onurhan1337/quzz-cli"
    license: "MIT"
    folder: Formula
    install: |
      bin.install "quzz"
    test: |
      system "#{bin}/quzz", "--version"
