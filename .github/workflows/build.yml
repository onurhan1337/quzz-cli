name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build -v .

    - name: Test
      run: go test -v ./...

    - name: Test CLI commands
      run: |
        ./quzz --help
        ./quzz visualize examples/traces.json --stats
        ./quzz visualize examples/traces.json --limit 3
        ./quzz visualize examples/traces.json --json > output.json
